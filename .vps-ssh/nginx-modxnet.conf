# modxnet.com — HTTP for ACME + HTTPS reverse proxy to Node (PM2)
# Cloudflare Full (strict): origin serves valid TLS on 443

server {
    listen 80;
    listen [::]:80;
    server_name modxnet.com www.modxnet.com;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name modxnet.com www.modxnet.com;

    ssl_certificate /etc/letsencrypt/live/modxnet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/modxnet.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3334;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
        proxy_connect_timeout 75s;
        proxy_buffering off;
    }
}
